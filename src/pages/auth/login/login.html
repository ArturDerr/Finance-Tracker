<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход</title>
    <link rel="stylesheet" href="login.module.css" />
  </head>
  <body>
    <main id="main-content">
      <div id="modal">
        <div id="header">
          <div id="logo-block">
            <img src="/assets/images/logo.svg" class="logo" />
          </div>
          <div id="heading-block">
            <h1 id="head-text">Войдите в аккаунт</h1>
            <h3 id="Subtitle-text">Чтобы следить за аналитикой финансов</h3>
          </div>
        </div>
        <div id="form-block">
          <form action="" id="login-form">
            <label for="email">
              Email
              <input type="email" name="email" id="email" required />
            </label>
            <label for="password">
              Password
              <input type="password" name="password" id="password" required />
            </label>
            <button type="submit" id="button">Войти</button>
          </form>
        </div>
        <div id="footer">
          <a
            >Еще нет аккаунта?
            <a href="registration.html">Зарегистрироваться</a></a
          >
        </div>
      </div>
    </main>
  </body>
  <script type="module" src="login.js"></script>
</html>
